services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: milestone
      POSTGRES_USER: milestone
      POSTGRES_PASSWORD: milestone
    ports:
      - "5432:5432"
    volumes:
      - milestone_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milestone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  milestone_postgres:
